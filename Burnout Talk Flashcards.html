<script>
const DATA = {"cards": [{"label": "Opening \u00b7 Welcome", "q": "How do you open? (1 min)", "pts": ["Name, role, wellness committee", "The hour: what it is, how to recognize it, where it comes from, what helps", "4 stations instead of a lecture, 8 minutes each", "Next few minutes: a shared starting point"], "anchor": "\"Good morning, everyone. I'm Sean Johnson.\"", "part": "Opening"}, {"label": "Opening \u00b7 How common", "q": "Which 4 facts show how common burnout is?", "pts": ["APA 2021: 79% reported work-related stress in the past month", "CDC health workers: 32% (2018) to 46% (2022) burned out often or very often", "ICD-11 QD85, occupational phenomenon; not in the DSM-5-TR", "2 to 3 times the risk of depression or anxiety"], "anchor": "\"It still carries real risk.\"", "part": "Opening"}, {"label": "Opening \u00b7 Absenteeism", "q": "What is absenteeism, and what's the Gallup finding?", "pts": ["Absenteeism = missing work", "Burned out very often or always: 63% more likely to take a sick day", "2.6 times as likely to be looking for another job"], "anchor": "\"Burnout affects how people show up to work in 2 ways.\"", "part": "Opening"}, {"label": "Opening \u00b7 Presenteeism", "q": "What is presenteeism, and why does it matter here?", "pts": ["At work, but unable to function at full capacity", "Concentration, judgment, and patience running low", "Cornell research: can cost more than absences", "Health care: linked to more patient safety incidents, lower quality of care"], "anchor": "\"It's harder to see than an empty desk.\"", "part": "Opening"}, {"label": "Opening \u00b7 Definition", "q": "Give the definition, word for word.", "pts": ["Chronic, work-related stress", "Physical and emotional exhaustion", "Cynicism", "A diminished sense of personal efficacy"], "anchor": "\"Burnout is a state of chronic, work-related stress that produces...\"", "part": "Opening"}, {"label": "Opening \u00b7 Origin", "q": "Where did the term come from?", "pts": ["Herbert Freudenberger, psychologist, early 1970s", "Volunteered at New York free clinics serving people who used drugs", "\"Burnout\" was already their word for the effects of long-term drug use", "1974: borrowed it for what the work did to staff, himself included"], "anchor": "\"...what the work was doing to the helpers.\"", "part": "Opening"}, {"label": "Opening \u00b7 3 dimensions", "q": "Maslach's 3 dimensions, plus the key point.", "pts": ["Emotional exhaustion: rest doesn't fix it", "Cynicism / depersonalization: distance from work, coworkers, patients", "Reduced personal efficacy: doubting work you used to feel confident in", "A predictable response to sustained, unmanaged conditions"], "anchor": "\"...whatever their individual strengths.\"", "part": "Opening"}, {"label": "Opening \u00b7 Signs", "q": "The 4 areas where burnout shows up.", "pts": ["Emotional: exhaustion, irritability, dread, emptiness", "Cognitive: concentration, memory, cynicism, the self-doubt cycle", "Behavioral: absences, procrastination, withdrawal", "Physical: fatigue, sleep, headaches, stomach, illness, tension"], "anchor": "\"The body keeps the score.\"", "part": "Opening"}, {"label": "Opening \u00b7 Stress vs. burnout", "q": "What do you say about stress vs. burnout?", "pts": ["Very little. Station 1 covers it.", "Mention that some signs overlap with everyday stress", "Skip the tests and examples; those belong to Station 1"], "anchor": "\"...that overlap is what Station 1 will work through with you.\"", "part": "Opening"}, {"label": "Opening \u00b7 Ground rules", "q": "The 2 ground rules.", "pts": ["Nothing collected except the dot stickers; the MBI sheet stays with them", "No one asked to talk about their own situation; sharing is optional"], "anchor": "\"Two ground rules before we start.\"", "part": "Opening"}, {"label": "Opening \u00b7 Getting started", "q": "How do you send them to stations?", "pts": ["4 stations, 8 minutes each", "On the call, move to the next number; 4 goes to 1", "Each station stands on its own", "Count off 1 to 4"], "anchor": "\"...head to the station with your number.\"", "part": "Opening"}, {"label": "Closing \u00b7 Before you start", "q": "What do you do before the group comes back?", "pts": ["Collect the chart from Station 2 near the end of the last rotation", "Keep the total out of view", "Ask everyone to keep their MBI sheet and card"], "anchor": "\"Welcome back.\"", "part": "Closing"}, {"label": "Closing \u00b7 Results", "q": "How do you present the dot-vote results? (5 min)", "pts": ["Every group added to it; first time anyone sees the total", "Read the top 2 areas and counts", "Ask: does this match what you expected?", "Ask: what does the top one look like day to day?", "Take 2 or 3 responses, about 3 minutes"], "anchor": "\"It reflects how this group sees the conditions we work in.\"", "part": "Closing"}, {"label": "Closing \u00b7 Next steps", "q": "What happens to the chart?", "pts": ["6 areas come from Maslach and Leiter", "Top 2 go to leadership", "Committee picks one concrete thing in the top area", "Follow-up with everyone within a month"], "anchor": "\"Here's what happens next.\"", "part": "Closing"}, {"label": "Closing \u00b7 Maintaining progress", "q": "How do people keep today's work going?", "pts": ["Re-score the MBI monthly; keep journaling", "Review card goals quarterly; 1 daily stress practice", "1 supportive relationship at work; flag capacity early", "Acknowledge your own progress"], "anchor": "\"A few ways to keep today's work going.\"", "part": "Closing"}, {"label": "Closing \u00b7 Seek help", "q": "When should someone reach out? Name all 6.", "pts": ["Burnout continues despite consistent effort", "Depression or anxiety symptoms", "Thoughts of self-harm or escaping the situation", "Work or home significantly affected", "Substances becoming a main way of coping", "Pulled away from most people"], "anchor": "\"Reaching out for support is part of the plan.\"", "part": "Closing"}, {"label": "Closing \u00b7 Takeaways", "q": "The 6 takeaways.", "pts": ["1. Predictable response to conditions", "2. Validated tools give trackable data", "3. Coping covers thinking, behavior, physical health", "4. Driven by conditions, experienced by individuals", "5. Resilience can be learned", "6. Specific goal on a schedule beats a general intention"], "anchor": "\"Six points to take with you.\"", "part": "Closing"}, {"label": "Closing \u00b7 Close", "q": "How do you end?", "pts": ["Predictable patterns mean it can be addressed", "Conditions can change; the results are a starting point", "Thank everyone", "Date the MBI sheet; re-score in 3 months"], "anchor": "\"...score it again and compare the 2.\"", "part": "Closing"}], "opening": [{"t": "cue", "title": "Welcome", "min": "1 min"}, {"t": "say", "text": "Good morning, everyone. I'm Sean Johnson. I'm a behavioral health clinician here, and I'm on the wellness committee along with the people running the 4 stations around us."}, {"t": "say", "text": "Over the next hour, we're going to look at burnout: what it is, how to recognize it, where it comes from, and what helps. Instead of a lecture, we've set this up as 4 short stations, each run by members of the committee. You'll spend 8 minutes at each one."}, {"t": "say", "text": "I'll take the next few minutes to give us a shared starting point, so each station can go straight into its activity."}, {"t": "cue", "title": "How common burnout is", "min": "1.5 min"}, {"t": "say", "text": "In the American Psychological Association's 2021 Work and Well-being Survey, 79% of U.S. workers reported work-related stress in the month before the survey."}, {"t": "say", "text": "Among health workers, the CDC found that the share who felt burned out often or very often rose from 32% in 2018 to 46% in 2022."}, {"t": "say", "text": "The World Health Organization includes burnout in the ICD-11 as an occupational phenomenon, under code QD85. It's classified as a workplace issue rather than a medical condition, and the DSM-5-TR doesn't list it as a diagnosis either."}, {"t": "say", "text": "It still carries real risk. People experiencing burnout are 2 to 3 times more likely to go on to develop clinical depression or an anxiety disorder."}, {"t": "cue", "title": "What it costs at work: absenteeism and presenteeism", "min": "1.5 min"}, {"t": "say", "text": "Burnout affects how people show up to work in 2 ways."}, {"t": "say", "text": "The first is absenteeism, which is missing work. Gallup found that employees who feel burned out very often or always are 63% more likely to take a sick day, and 2.6 times as likely to be looking for another job."}, {"t": "say", "text": "The second is presenteeism, which is being at work while unable to function at full capacity. You're here, but your concentration, judgment, and patience are running low. It's harder to see than an empty desk, and research from Cornell's Institute for Health and Productivity Studies found that presenteeism can cost organizations more than absences do."}, {"t": "say", "text": "In health care, this matters beyond productivity. Burnout among clinicians is linked to more patient safety incidents and lower quality of care."}, {"t": "cue", "title": "What burnout is", "min": "2 min"}, {"t": "say", "text": "Here's the definition we're using today. Burnout is a state of chronic, work-related stress that produces physical and emotional exhaustion, cynicism, and a diminished sense of personal efficacy."}, {"t": "say", "text": "The term comes from Herbert Freudenberger, a psychologist who volunteered at free clinics in New York in the early 1970s. Many of the people those clinics served used drugs, and \"burnout\" was already their word for what long-term drug use did to a person. Freudenberger noticed that the staff, himself included, were wearing down in a similar way, and in 1974 he borrowed the word to describe what the work was doing to the helpers."}, {"t": "say", "text": "Christina Maslach and her colleagues later gave the concept a structure and a way to measure it. Their research identifies 3 dimensions."}, {"t": "say", "text": "Emotional exhaustion: feeling drained in a way that rest doesn't fix."}, {"t": "say", "text": "Cynicism, also called depersonalization: a growing distance from the work, from coworkers, and from the people we serve."}, {"t": "say", "text": "Reduced personal efficacy: doubting your ability to do work you used to feel confident in."}, {"t": "say", "text": "One point to keep in mind before we split up: burnout is a predictable response to sustained, unmanaged conditions. When enough people work under the same conditions for long enough, burnout tends to follow, whatever their individual strengths."}, {"t": "cue", "title": "How it shows up", "min": "1.5 min"}, {"t": "say", "text": "Station 1 will look closely at the difference between stress and burnout, so I'll focus on the signs. Burnout tends to show up in 4 areas."}, {"t": "say", "text": "Emotionally: persistent exhaustion, irritability, dread about work, and a sense of emptiness where satisfaction used to be."}, {"t": "say", "text": "Cognitively: trouble concentrating, memory lapses, growing cynicism, and a cycle of self-doubt. You feel less capable, you perform less effectively, and then you feel even less capable."}, {"t": "say", "text": "Behaviorally: more absences, procrastination, withdrawing from coworkers, and letting go of responsibilities that used to feel important."}, {"t": "say", "text": "Physically, which is often the last area people notice: chronic fatigue, sleep problems, headaches, stomach issues, getting sick more often, and muscle tension. Bessel van der Kolk's phrase applies here: the body keeps the score, even when the mind keeps pushing through."}, {"t": "say", "text": "These signs rarely appear alone. Some of them also overlap with everyday stress, and that overlap is what Station 1 will work through with you."}, {"t": "cue", "title": "Ground rules and getting started", "min": "1.5 min"}, {"t": "say", "text": "Two ground rules before we start."}, {"t": "say", "text": "First, nothing you write today will be collected, except the dot stickers at Station 2. One station uses a validated burnout measure. You keep that sheet, and no one will ask about your score."}, {"t": "say", "text": "Second, no one will be asked to talk about their own situation. You can take part fully by working with the material, and how much you share is up to you."}, {"t": "say", "text": "There are 4 stations, 8 minutes each. When you hear the call to rotate, move to the next station number. Station 4 moves to Station 1. Each station stands on its own, so it doesn't matter where you start."}, {"t": "say", "text": "Please count off from 1 to 4, and head to the station with your number."}, {"t": "stage", "text": "Point to each station as you name its number. The timekeeper starts the first rotation once every group has arrived."}], "closing": [{"t": "cue", "title": "The dot-vote results", "min": "5 min"}, {"t": "stage", "text": "Near the end of the last rotation, collect the dot-vote chart from Station 2 and bring it to the front. Keep the total out of view until everyone is back."}, {"t": "say", "text": "Welcome back. Please keep your MBI sheet and your commitment card with you."}, {"t": "say", "text": "This is the chart from Station 2. Every group added to it, and this is the first time anyone is seeing the full results. It reflects how this group sees the conditions we work in."}, {"t": "stage", "text": "Read the top 2 areas and their dot counts out loud. Pause briefly."}, {"t": "say", "text": "Does this match what you expected?"}, {"t": "say", "text": "For the area with the most dots, what does that look like day to day?"}, {"t": "stage", "text": "Take 2 or 3 responses, about 3 minutes total. Thank each person who speaks."}, {"t": "say", "text": "Here's what happens next. These 6 areas come from Maslach and Leiter's research on the organizational conditions that drive burnout. The committee will bring the top 2 to leadership and choose one concrete thing within the top area to work on. We'll follow up with everyone within a month."}, {"t": "cue", "title": "Maintaining progress", "min": "1.5 min"}, {"t": "say", "text": "A few ways to keep today's work going. Re-score the MBI every month or so. Keep up any journaling you start. Review the goals on your commitment card every quarter. Keep one stress management practice going daily. Build at least one supportive relationship at work, and let leadership know early when your capacity is stretched. It also helps to notice and acknowledge your own progress, which is easy to skip."}, {"t": "cue", "title": "When to seek help", "min": "1.5 min"}, {"t": "say", "text": "Individual strategies help, and they also have limits. Consider reaching out for professional support if burnout continues despite consistent effort, if symptoms of depression or anxiety are showing up, or if you're having thoughts of harming yourself or of escaping the situation. The same goes if work or home life is significantly affected, if alcohol or other substances have become a main way of coping, or if you've pulled away from most of the people in your life."}, {"t": "say", "text": "The back of your commitment card lists the Employee Assistance Program, the NAMI HelpLine, the San Diego Access and Crisis Line, and 988. Reaching out for support is part of the plan."}, {"t": "cue", "title": "Six takeaways", "min": "2 min"}, {"t": "say", "text": "Six points to take with you."}, {"t": "say", "text": "1. Burnout is a predictable response to sustained conditions. It reflects the work environment, and it says little about personal weakness."}, {"t": "say", "text": "2. Validated tools like the MBI give you data you can track over time."}, {"t": "say", "text": "3. Effective coping addresses how you think, what you do, and your physical health, all together."}, {"t": "say", "text": "4. Burnout is driven by workplace conditions and experienced by individuals. That's why the dot-vote chart matters."}, {"t": "say", "text": "5. Resilience can be learned and strengthened with practice."}, {"t": "say", "text": "6. A specific goal, reviewed on a schedule, works better than a general intention. That's the SMART goal and PDSA cycle from Station 4."}, {"t": "cue", "title": "Close", "min": "1 min"}, {"t": "say", "text": "Burnout is common in this work, and because it follows predictable patterns, it can be addressed. The conditions behind it can change, and today's results give the committee a place to start."}, {"t": "say", "text": "Thank you for being here and for taking part."}, {"t": "say", "text": "Before you go, write today's date on your MBI sheet and keep it somewhere you'll find it. In 3 months, score it again and compare the 2."}, {"t": "stage", "text": "Point out the take-home sheets on the way out. Committee members stay about 5 minutes after to photograph the chart."}]};
let filter = 'All', shuffled = false, order = [], pos = 0, known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem('sean-fc-known') || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem('sean-fc-known', JSON.stringify([...known])); } catch (e) {} };
const $ = id => document.getElementById(id);

function build() {
  order = DATA.cards.map((c, i) => i).filter(i => filter === 'All' || DATA.cards[i].part === filter);
  const left = order.filter(i => !known.has(i));
  order = left.length ? left : order;
  if (shuffled) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  pos = 0; show();
}
function show() {
  const card = $('card'); card.classList.remove('flip');
  const total = DATA.cards.filter(c => filter === 'All' || c.part === filter).length;
  const doneN = DATA.cards.filter((c, i) => (filter === 'All' || c.part === filter) && known.has(i)).length;
  $('count').textContent = doneN + ' of ' + total + ' down';
  $('prog').style.width = (total ? doneN / total * 100 : 0) + '%';
  if (pos >= order.length) {
    $('f-lab').textContent = 'Round done';
    $('f-q').innerHTML = 'All cards in this set are done. Tap “Again” to start the set over.';
    $('b-lab').textContent = ''; $('b-pts').innerHTML = ''; $('b-anc').textContent = '';
    return;
  }
  const i = order[pos], c = DATA.cards[i];
  $('f-lab').textContent = c.label + ' · #' + (i + 1);
  $('f-q').textContent = c.q;
  $('b-lab').textContent = c.label;
  $('b-pts').innerHTML = c.pts.map(p => '<li>' + esc(p) + '</li>').join('');
  $('b-anc').textContent = c.anchor;
}
const esc = s => s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function flip() { if (pos < order.length) $('card').classList.toggle('flip'); }
function got() { if (pos >= order.length) return; known.add(order[pos]); save(); pos++; show(); }
function again() {
  if (pos >= order.length) { DATA.cards.forEach((c, i) => { if (filter === 'All' || c.part === filter) known.delete(i); }); save(); build(); return; }
  const i = order.splice(pos, 1)[0]; order.push(i); show();
}
function prev() { if (pos > 0) { pos--; show(); } }

$('card').addEventListener('click', flip);
$('gotit').addEventListener('click', got);
$('again').addEventListener('click', again);
$('prev').addEventListener('click', prev);
document.querySelectorAll('.chip[data-f]').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f; document.querySelectorAll('.chip[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); build();
}));
$('shuffle').addEventListener('click', e => { shuffled = !shuffled; e.currentTarget.setAttribute('aria-pressed', shuffled); build(); });
document.addEventListener('keydown', e => {
  if (!$('script-view').hidden) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') got(); else if (e.key === 'ArrowLeft') prev(); else if (e.key.toLowerCase() === 'a') again();
});

function renderScript() {
  const part = (title, blocks) => '<h2>' + title + '</h2>' + blocks.map(b =>
    b.t === 'cue' ? '<div class="cue"><span>' + esc(b.title) + '</span><em>about ' + b.min + '</em></div>'
    : b.t === 'stage' ? '<div class="stage-dir">' + esc(b.text) + '</div>' : '<p class="say">' + esc(b.text) + '</p>').join('');
  $('script-view').innerHTML = part('Opening · about 9 minutes', DATA.opening) + part('Closing · about 11 minutes', DATA.closing);
}
function tab(which) {
  $('tab-cards').setAttribute('aria-selected', which === 'cards'); $('tab-script').setAttribute('aria-selected', which === 'script');
  $('cards-view').hidden = which !== 'cards'; $('script-view').hidden = which !== 'script';
}
$('tab-cards').addEventListener('click', () => tab('cards'));
$('tab-script').addEventListener('click', () => tab('script'));
renderScript(); build();
</script>

</body></html>
