<div class="wrap">
  <div class="eyebrow">Wellness Committee · Managing Burnout</div>
  <h1>Opening and closing, on cards</h1>
  <p class="sub">Tap a card to flip it. Try saying the points out loud before you look.</p>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-cards" role="tab" aria-selected="true">Flashcards</button>

<script>
const DATA = {"cards": [{"label": "Opening 1 \u00b7 Welcome", "q": "How do you open? (30 sec)", "pts": ["Name, role, wellness committee", "The hour: what burnout is, how common, what it costs, what helps", "4 stations, 8 minutes each", "Next few minutes: a shared starting point"], "anchor": "\"Good morning, everyone. I'm Sean Johnson.\"", "part": "Opening"}, {"label": "Opening 2 \u00b7 Origin", "q": "Where did the word come from?", "pts": ["Herbert Freudenberger, psychologist, New York free clinics, early 1970s", "\"Burnout\" was already the word there for long-term drug use", "Saw staff, himself included, wearing down the same way", "Borrowed the word for what the work did to the helpers", "Cite: Freudenberger, H. J. (1974). Staff burn-out. Journal of Social Issues, 30(1), 159\u2013165."], "anchor": "\"...what the work was doing to the helpers.\"", "part": "Opening"}, {"label": "Opening 3 \u00b7 Definition", "q": "Give the definition, word for word.", "pts": ["Chronic, work-related stress", "Physical and emotional exhaustion", "Cynicism", "A diminished sense of personal efficacy"], "anchor": "\"Burnout is a state of chronic, work-related stress that produces...\"", "part": "Opening"}, {"label": "Opening 3 \u00b7 Measurement", "q": "How did Maslach operationalize burnout?", "pts": ["With Susan Jackson: surveyed human services workers, tested a large item pool, narrowed it to 22", "3 subscales: emotional exhaustion (9 items), depersonalization / cynicism (5), personal accomplishment (8)", "Each item rated by frequency: 0 never to 6 every day", "Most widely used measure; versions for medical staff, educators, other jobs", "They'll score it at Station 3", "Cite: Maslach, C., & Jackson, S. E. (1981). The measurement of experienced burnout. Journal of Occupational Behaviour, 2(2), 99\u2013113."], "anchor": "\"Christina Maslach turned that idea into something you can measure.\"", "part": "Opening"}, {"label": "Opening 3 \u00b7 Classification", "q": "How is burnout classified?", "pts": ["2019: WHO adds it to ICD-11 as an occupational phenomenon", "A workplace issue, not a medical condition", "Not a DSM-5-TR diagnosis", "Key point: a predictable response to sustained, unmanaged conditions", "Cite: World Health Organization (2019), ICD-11 QD85."], "anchor": "\"The key point...\"", "part": "Opening"}, {"label": "Opening 4 \u00b7 Prevalence", "q": "How common is it? Go from broad to narrow.", "pts": ["All U.S. workers: 79% reported work-related stress in the past month (stress, not burnout)", "Health workers: burned out often or very often, 32% (2018) to 46% (2022)", "Physicians: 41.9% in 2025, down from 48.2% in 2023", "Other surveys run higher: depends who's counting", "Cite: APA Work and Well-being Survey (2021), via Abramson, Monitor on Psychology (2022) \u00b7 CDC Vital Signs (Oct 2023) \u00b7 AMA press release (Apr 2026)"], "anchor": "\"Start broad.\"", "part": "Opening"}, {"label": "Opening 4 \u00b7 By role", "q": "How does it vary by role, and what's the caveat?", "pts": ["Emergency medicine near 50%", "Family medicine 45%", "Psychiatry 31.6%", "Infectious disease about 23%", "Caveat: most research is on physicians; little on nurses, behavioral health, support staff", "Cite: American Medical Association (2026, April). Physician burnout rates are falling, specialty gaps remain."], "anchor": "\"It also varies by role.\"", "part": "Opening"}, {"label": "Opening 5 \u00b7 Risk", "q": "What does burnout put at risk?", "pts": ["The person: 2 to 3 times more likely to develop depression or anxiety", "Patients: about 239,000 physicians, roughly double the risk of patient safety incidents", "Blame cultures make it worse: near misses go unreported", "Cite: Salvagioni et al. (2017), PLOS ONE, 12(10) \u00b7 Hodkinson et al. (2022), BMJ, 378, e070442"], "anchor": "\"For the person... For patients...\"", "part": "Opening"}, {"label": "Opening 6 \u00b7 At work", "q": "How does it show up at work? Absenteeism.", "pts": ["Signs: concentration, short patience with coworkers, pulling back, more sick days", "Absenteeism = missing work", "Burned out very often or always: 63% more likely to take a sick day", "2.6 times as likely to be looking for another job", "Cite: Gallup (2020). Employee burnout: Causes and cures."], "anchor": "\"It costs organizations in 2 ways.\"", "part": "Opening"}, {"label": "Opening 6 \u00b7 Presenteeism", "q": "What is presenteeism, and why does it cost more?", "pts": ["At work, but unable to function at full capacity", "Invisible and daily: an absence shows on a timesheet and gets covered; presenteeism doesn't", "Builds through slower work, errors, and rework", "10 common health conditions: presenteeism was 18% to 60% of total cost to employers", "Not burnout-specific, but shows where the cost hides", "Cite: Goetzel, R. Z., et al. (2004). Journal of Occupational and Environmental Medicine, 46(4), 398\u2013412 (Cornell)."], "anchor": "\"...people who are present and struggling.\"", "part": "Opening"}, {"label": "Opening 7 \u00b7 Structure", "q": "How does the way work is built drive burnout?", "pts": ["25+ point specialty gap, similar training: points to job design more than to the people", "Workload, control over the schedule, whether time off is really off", "About 1 in 5 physicians: 8+ hours a week of after-hours charting", "Primary care: a 30-minute visit means about 36 minutes of EHR work", "Work follows people home, so time off stops being recovery", "Cite: AMA (2024), \"pajama time\" report \u00b7 Overhage & McCallie (2020), Annals of Internal Medicine, 172(3), 169\u2013174"], "anchor": "\"When the work follows people home...\"", "part": "Opening"}, {"label": "Opening 7 \u00b7 Changing structure", "q": "What happens when the structure changes?", "pts": ["Ambient AI scribes, 6 health systems", "Burnout 51.9% to 38.8% within 30 days", "Hand-off: Station 2 looks at workplace conditions", "Cite: Olson, K. D., et al. (2025). JAMA Network Open, 8(10)."], "anchor": "\"Changing the structure helps.\"", "part": "Opening"}, {"label": "Opening 8 \u00b7 Recovery", "q": "What did Shanafelt's 2026 study find?", "pts": ["Asked physicians whose burnout improved a lot what changed", "Nearly 9 in 10 made an active change, personal or at work", "Very few improved by waiting it out", "Most common personal change: separating self-worth from their role", "Cite: Shanafelt, T. D., et al. (2026). JAMA Network Open, 9(9), e2635986."], "anchor": "\"Very few got better by waiting it out.\"", "part": "Opening"}, {"label": "Opening 8 \u00b7 Meaning", "q": "What did the 3-year meaning study find?", "pts": ["1,200+ frontline health and social care workers", "Meaning in life: less burnout", "Still searching for meaning: more burnout", "Work can be meaningful without carrying all the meaning", "Optional take-home sheet by the exit", "Cite: Sumner, R. C., Kinsella, E. L., & van Tilburg, W. A. P. (2026). Journal of Health Psychology."], "anchor": "\"Work can be meaningful without carrying all the meaning in your life.\"", "part": "Opening"}, {"label": "Opening 9 \u00b7 Getting started", "q": "Ground rules and send-off.", "pts": ["Nothing collected except dot stickers; MBI sheet stays with them", "No one asked to share; how much is up to them", "4 stations, 8 minutes; next number on the call; 4 goes to 1", "Count off 1 to 4"], "anchor": "\"...head to the station with your number.\"", "part": "Opening"}, {"label": "Closing \u00b7 Results", "q": "How do you present the dot-vote results? (5 min)", "pts": ["Collect the chart near the end of the last rotation", "Every group added to it; first time anyone sees the total", "Read the top 2 areas and counts", "Ask: does this match what you expected?", "Ask: what does the top one look like day to day?"], "anchor": "\"It reflects how this group sees the conditions we work in.\"", "part": "Closing"}, {"label": "Closing \u00b7 Next steps", "q": "What happens to the chart?", "pts": ["6 areas come from Maslach and Leiter", "Top 2 go to leadership", "Committee picks one concrete thing in the top area", "Follow-up with everyone within a month"], "anchor": "\"Here's what happens next.\"", "part": "Closing"}, {"label": "Closing \u00b7 Maintaining progress", "q": "How do people keep today's work going?", "pts": ["Re-score the MBI monthly", "Review card goals quarterly; 1 daily stress practice", "1 supportive relationship at work; flag capacity early"], "anchor": "\"A few ways to keep today's work going.\"", "part": "Closing"}, {"label": "Closing \u00b7 Seek help", "q": "When should someone reach out? Name all 6.", "pts": ["Burnout continues despite consistent effort", "Depression or anxiety symptoms", "Thoughts of self-harm or escaping the situation", "Work or home significantly affected", "Substances becoming a main way of coping", "Pulled away from most people"], "anchor": "\"Reaching out for support is part of the plan.\"", "part": "Closing"}, {"label": "Closing \u00b7 Takeaways", "q": "The 6 takeaways.", "pts": ["1. Predictable response to conditions", "2. Validated tools give trackable data", "3. Coping covers thinking, behavior, physical health", "4. Driven by conditions, experienced by individuals", "5. Active changes beat waiting it out", "6. Specific goal on a schedule beats a general intention"], "anchor": "\"Six points to take with you.\"", "part": "Closing"}, {"label": "Closing \u00b7 Close", "q": "How do you end?", "pts": ["Predictable patterns mean it can be addressed", "Conditions can change; the results are a starting point", "Thank everyone", "Date the MBI sheet; re-score in 3 months"], "anchor": "\"...score it again and compare the 2.\"", "part": "Closing"}], "opening": [{"t": "cue", "title": "Welcome", "min": "0.5 min"}, {"t": "say", "text": "Good morning, everyone. I'm Sean Johnson. I'm a behavioral health clinician here, and I'm on the wellness committee along with the people running the 4 stations around us. Over the next hour we'll look at what burnout is, how common it is, what it costs, and what helps. You'll spend 8 minutes at each station, and I'll use the next few minutes to give us a shared starting point."}, {"t": "cue", "title": "Where the word came from", "min": "1 min"}, {"t": "say", "text": "The term comes from Herbert Freudenberger, a psychologist who volunteered at free clinics in New York in the early 1970s. \"Burnout\" was already the word people there used for what long-term drug use did to a person. Freudenberger saw the staff, himself included, wearing down in a similar way. In 1974 he wrote it up in the Journal of Social Issues, borrowing the word for what the work was doing to the helpers."}, {"t": "cue", "title": "What burnout is, and how it is measured", "min": "1.5 min"}, {"t": "say", "text": "Here's the definition we're using today. Burnout is a state of chronic, work-related stress that produces physical and emotional exhaustion, cynicism, and a diminished sense of personal efficacy."}, {"t": "say", "text": "Christina Maslach turned that idea into something you can measure. With Susan Jackson, she surveyed human services workers, tested a large pool of statements, and narrowed them to 22. In 1981 they published the result in the Journal of Occupational Behaviour as the Maslach Burnout Inventory. It has 3 subscales: emotional exhaustion, with 9 items; depersonalization, also called cynicism, with 5; and personal accomplishment, with 8. Each item is rated by how often you feel it, from 0 for never to 6 for every day. It's still the most widely used burnout measure, with versions for medical staff, educators, and other jobs, and you'll get to score it at Station 3."}, {"t": "say", "text": "In 2019 the World Health Organization added burnout to the ICD-11 as an occupational phenomenon. It's classified as a workplace issue rather than a medical condition, and the DSM-5-TR doesn't list it as a diagnosis. The key point: burnout is a predictable response to sustained, unmanaged conditions at work."}, {"t": "cue", "title": "How common it is", "min": "1.5 min"}, {"t": "say", "text": "Start broad. In the American Psychological Association's 2021 Work and Well-being Survey, 79% of U.S. workers reported work-related stress in the month before the survey. That's stress, which isn't the same as burnout, but it's the ground burnout grows in."}, {"t": "say", "text": "Narrow it to health care. The CDC found that the share of health workers who felt burned out often or very often rose from 32% in 2018 to 46% in 2022. For physicians, the American Medical Association's 2025 data puts burnout at 41.9%, down from 48.2% in 2023. Other national surveys report higher rates, so the exact number depends on who's counting and how they ask."}, {"t": "say", "text": "It also varies by role. In the AMA data, emergency medicine is near 50%, family medicine is at 45%, psychiatry is at 31.6%, and infectious disease is around 23%. One caveat: most of this research is on physicians, and much less covers nurses, behavioral health, or support staff, so treat these numbers as a guide."}, {"t": "cue", "title": "What it puts at risk", "min": "1 min"}, {"t": "say", "text": "For the person, burnout raises the risk of depression and anxiety. People experiencing it are 2 to 3 times more likely to go on to develop one of those disorders."}, {"t": "say", "text": "For patients, a 2022 meta-analysis in the BMJ covering about 239,000 physicians found burnout linked to roughly double the risk of patient safety incidents. Workplaces that respond to mistakes with blame make this worse, because people stop reporting near misses."}, {"t": "cue", "title": "How it shows up at work", "min": "1.5 min"}, {"t": "say", "text": "At work, burnout usually looks like trouble concentrating, shorter patience with coworkers, pulling back from the team, and more sick days. It costs organizations in 2 ways."}, {"t": "say", "text": "The first is absenteeism, which is missing work. Gallup found that employees who feel burned out very often or always are 63% more likely to take a sick day, and 2.6 times as likely to be looking for another job."}, {"t": "say", "text": "The second is presenteeism: being at work while unable to function at full capacity. You're at your desk, but your concentration, judgment, and patience are running low. It tends to cost more because it's invisible and it happens every day. An absence shows up on a timesheet and someone covers it. Presenteeism doesn't show up anywhere, so it builds through slower work, errors, and rework. A 2004 Cornell study led by Ron Goetzel looked at 10 common health conditions and found that presenteeism made up 18% to 60% of their total cost to employers. That study wasn't about burnout specifically, but it shows how much of the cost hides in people who are present and struggling."}, {"t": "cue", "title": "How the work is built", "min": "1 min"}, {"t": "say", "text": "That gap between specialties, more than 25 points between people with similar training, points to how the jobs are built more than to who is doing them: workload, control over the schedule, and whether time off is really time off."}, {"t": "say", "text": "Documentation is a good example. About 1 in 5 physicians spends 8 or more hours a week on after-hours charting, and in primary care, one study found that a 30-minute visit generates about 36 minutes of EHR work. When the work follows people home, time off stops being recovery time. Changing the structure helps: in a 2025 study across 6 health systems, clinicians who started using ambient AI scribes saw burnout drop from 51.9% to 38.8% within 30 days. Station 2 looks at these workplace conditions in more detail."}, {"t": "cue", "title": "What recovery looks like", "min": "1 min"}, {"t": "say", "text": "A 2026 study led by Tait Shanafelt asked physicians whose burnout had improved a lot what changed. Nearly 9 in 10 had made an active change, in their personal life or in how they worked. Very few got better by waiting it out. The most common personal change was separating their sense of self-worth from their role."}, {"t": "say", "text": "A 3-year study of more than 1,200 frontline health and social care workers found something related. People who felt their lives had meaning reported less burnout, and people still searching for meaning reported more. Work can be meaningful without carrying all the meaning in your life. There's an optional take-home sheet on this idea by the exit."}, {"t": "cue", "title": "Ground rules and getting started", "min": "1 min"}, {"t": "say", "text": "Two ground rules. First, nothing you write today will be collected, except the dot stickers at Station 2, and you keep your MBI sheet. Second, no one will be asked to talk about their own situation. How much you share is up to you."}, {"t": "say", "text": "There are 4 stations, 8 minutes each. When you hear the call to rotate, move to the next station number, and Station 4 moves to Station 1. Each station stands on its own, so it doesn't matter where you start. Please count off from 1 to 4, and head to the station with your number."}, {"t": "stage", "text": "Point to each station as you name its number. The timekeeper starts the first rotation once every group has arrived."}], "closing": [{"t": "cue", "title": "The dot-vote results", "min": "5 min"}, {"t": "stage", "text": "Near the end of the last rotation, collect the dot-vote chart from Station 2 and bring it to the front. Keep the total out of view until everyone is back."}, {"t": "say", "text": "Welcome back. Please keep your MBI sheet and your commitment card with you."}, {"t": "say", "text": "This is the chart from Station 2. Every group added to it, and this is the first time anyone is seeing the full results. It reflects how this group sees the conditions we work in."}, {"t": "stage", "text": "Read the top 2 areas and their dot counts out loud. Pause briefly."}, {"t": "say", "text": "Does this match what you expected?"}, {"t": "say", "text": "For the area with the most dots, what does that look like day to day?"}, {"t": "stage", "text": "Take 2 or 3 responses, about 3 minutes total. Thank each person who speaks."}, {"t": "say", "text": "Here's what happens next. These 6 areas come from Maslach and Leiter's research on the organizational conditions that drive burnout. The committee will bring the top 2 to leadership and choose one concrete thing within the top area to work on. We'll follow up with everyone within a month."}, {"t": "cue", "title": "Maintaining progress", "min": "1 min"}, {"t": "say", "text": "A few ways to keep today's work going. Re-score the MBI every month or so. Review the goals on your commitment card every quarter, and keep one stress management practice going daily. Build at least one supportive relationship at work, and let leadership know early when your capacity is stretched."}, {"t": "cue", "title": "When to seek help", "min": "1.5 min"}, {"t": "say", "text": "Individual strategies help, and they also have limits. Consider reaching out for professional support if burnout continues despite consistent effort, if symptoms of depression or anxiety are showing up, or if you're having thoughts of harming yourself or of escaping the situation. The same goes if work or home life is significantly affected, if alcohol or other substances have become a main way of coping, or if you've pulled away from most of the people in your life."}, {"t": "say", "text": "The back of your commitment card lists the Employee Assistance Program, the NAMI HelpLine, the San Diego Access and Crisis Line, and 988. Reaching out for support is part of the plan."}, {"t": "cue", "title": "Six takeaways", "min": "1.5 min"}, {"t": "say", "text": "Six points to take with you."}, {"t": "say", "text": "1. Burnout is a predictable response to sustained conditions. It reflects the work environment, and it says little about personal weakness."}, {"t": "say", "text": "2. Validated tools like the MBI give you data you can track over time."}, {"t": "say", "text": "3. Effective coping addresses how you think, what you do, and your physical health, all together."}, {"t": "say", "text": "4. Burnout is driven by workplace conditions and experienced by individuals. That's why the dot-vote chart matters."}, {"t": "say", "text": "5. Recovery usually comes from active changes, at work or in your personal life. Waiting it out rarely works."}, {"t": "say", "text": "6. A specific goal, reviewed on a schedule, works better than a general intention. That's the SMART goal and PDSA cycle from Station 4."}, {"t": "cue", "title": "Close", "min": "1 min"}, {"t": "say", "text": "Burnout is common in this work, and because it follows predictable patterns, it can be addressed. The conditions behind it can change, and today's results give the committee a place to start."}, {"t": "say", "text": "Thank you for being here and for taking part."}, {"t": "say", "text": "Before you go, write today's date on your MBI sheet and keep it somewhere you'll find it. In 3 months, score it again and compare the 2."}, {"t": "stage", "text": "Point out the take-home sheets on the way out. Committee members stay about 5 minutes after to photograph the chart."}]};
let filter = 'All', shuffled = false, order = [], pos = 0, known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem('sean-fc-known') || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem('sean-fc-known', JSON.stringify([...known])); } catch (e) {} };
const $ = id => document.getElementById(id);

function build() {
  order = DATA.cards.map((c, i) => i).filter(i => filter === 'All' || DATA.cards[i].part === filter);
  const left = order.filter(i => !known.has(i));
  order = left.length ? left : order;
  if (shuffled) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  pos = 0; show();
}
function show() {
  const card = $('card'); card.classList.remove('flip');
  const total = DATA.cards.filter(c => filter === 'All' || c.part === filter).length;
  const doneN = DATA.cards.filter((c, i) => (filter === 'All' || c.part === filter) && known.has(i)).length;
  $('count').textContent = doneN + ' of ' + total + ' down';
  $('prog').style.width = (total ? doneN / total * 100 : 0) + '%';
  if (pos >= order.length) {
    $('f-lab').textContent = 'Round done';
    $('f-q').innerHTML = 'All cards in this set are done. Tap “Again” to start the set over.';
    $('b-lab').textContent = ''; $('b-pts').innerHTML = ''; $('b-anc').textContent = '';
    return;
  }
  const i = order[pos], c = DATA.cards[i];
  $('f-lab').textContent = c.label + ' · #' + (i + 1);
  $('f-q').textContent = c.q;
  $('b-lab').textContent = c.label;
  $('b-pts').innerHTML = c.pts.map(p => p.startsWith('Cite:') ? '<li class="cite">' + esc(p) + '</li>' : '<li>' + esc(p) + '</li>').join('');
  $('b-anc').textContent = c.anchor;
}
const esc = s => s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function flip() { if (pos < order.length) $('card').classList.toggle('flip'); }
function got() { if (pos >= order.length) return; known.add(order[pos]); save(); pos++; show(); }
function again() {
  if (pos >= order.length) { DATA.cards.forEach((c, i) => { if (filter === 'All' || c.part === filter) known.delete(i); }); save(); build(); return; }
  const i = order.splice(pos, 1)[0]; order.push(i); show();
}
function prev() { if (pos > 0) { pos--; show(); } }

$('card').addEventListener('click', flip);
$('gotit').addEventListener('click', got);
$('again').addEventListener('click', again);
$('prev').addEventListener('click', prev);
document.querySelectorAll('.chip[data-f]').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f; document.querySelectorAll('.chip[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); build();
}));
$('shuffle').addEventListener('click', e => { shuffled = !shuffled; e.currentTarget.setAttribute('aria-pressed', shuffled); build(); });
document.addEventListener('keydown', e => {
  if (!$('script-view').hidden) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') got(); else if (e.key === 'ArrowLeft') prev(); else if (e.key.toLowerCase() === 'a') again();
});

function renderScript() {
  const part = (title, blocks) => '<h2>' + title + '</h2>' + blocks.map(b =>
    b.t === 'cue' ? '<div class="cue"><span>' + esc(b.title) + '</span><em>about ' + b.min + '</em></div>'
    : b.t === 'stage' ? '<div class="stage-dir">' + esc(b.text) + '</div>' : '<p class="say">' + esc(b.text) + '</p>').join('');
  $('script-view').innerHTML = part('Opening · about 10 minutes', DATA.opening) + part('Closing · about 10 minutes', DATA.closing);
}
function tab(which) {
  $('tab-cards').setAttribute('aria-selected', which === 'cards'); $('tab-script').setAttribute('aria-selected', which === 'script');
  $('cards-view').hidden = which !== 'cards'; $('script-view').hidden = which !== 'script';
}
$('tab-cards').addEventListener('click', () => tab('cards'));
$('tab-script').addEventListener('click', () => tab('script'));
renderScript(); build();
</script>
