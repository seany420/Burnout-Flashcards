ur, we're going to look at burnout: what it is, how to recognize it, where it comes from, and what helps. Instead of a lecture, we've set this up as 4 short stations, each run by members of the committee. You'll spend 8 minutes at each one."}, {"t": "say", "text": "I'll take the next few minutes to give us a shared starting point, so each station can go straight into its activity."}, {"t": "cue", "title": "How common burnout is", "min": "1.5 min"}, {"t": "say", "text": "In the American Psychological Association's 2021 Work and Well-being Survey, 79% of U.S. workers reported work-related stress in the month before the survey."}, {"t": "say", "text": "For physicians, the American Medical Association's 2025 data puts burnout at 41.9%, down from 48.2% in 2023. Other national surveys report higher rates, so the exact number depends on who's counting and how they ask. Across health workers more broadly, the CDC found that the share who felt burned out often or very often rose from 32% in 2018 to 46% in 2022."}, {"t": "say", "text": "The World Health Organization includes burnout in the ICD-11 as an occupational phenomenon. It's classified as a workplace issue rather than a medical condition, and the DSM-5-TR doesn't list it as a diagnosis. It still carries real risk: people experiencing burnout are 2 to 3 times more likely to go on to develop clinical depression or an anxiety disorder."}, {"t": "say", "text": "One caveat for this room. Most burnout research is on physicians. Much less of it covers nurses, behavioral health, or support staff, so treat these numbers as a guide."}, {"t": "cue", "title": "How the work is built", "min": "1.5 min"}, {"t": "say", "text": "Burnout rates vary a lot by specialty. In the AMA's 2025 data, emergency medicine is near 50% and infectious disease is around 23%. Family medicine sits at 45%, and psychiatry at 31.6%. A gap of more than 25 points between people with similar training points to how the jobs are built more than to who is doing them."}, {"t": "say", "text": "Documentation is a big part of that structure. About 1 in 5 physicians spends 8 or more hours a week on after-hours charting, and that share hasn't moved since 2022. In primary care, one study found that a 30-minute visit generates about 36 minutes of EHR work."}, {"t": "say", "text": "Changing the structure helps. In a 2025 study across 6 health systems, clinicians who started using ambient AI scribes saw burnout drop from 51.9% to 38.8% within 30 days. Station 2 looks at these workplace conditions in more detail."}, {"t": "cue", "title": "What it costs", "min": "1 min"}, {"t": "say", "text": "Burnout shows up as absenteeism, which is missing work. Gallup found that employees who feel burned out very often or always are 63% more likely to take a sick day. It also shows up as presenteeism, which is being at work without the concentration, judgment, or patience to function at full capacity. Research from Cornell found presenteeism can cost organizations more than absences do."}, {"t": "say", "text": "In health care, it's also a safety issue. A 2022 meta-analysis covering about 239,000 physicians found burnout linked to roughly double the risk of patient safety incidents. Workplaces that respond to mistakes with blame make this worse, because people stop reporting near misses."}, {"t": "cue", "title": "What burnout is", "min": "1.5 min"}, {"t": "say", "text": "Here's the definition we're using today. Burnout is a state of chronic, work-related stress that produces physical and emotional exhaustion, cynicism, and a diminished sense of personal efficacy."}, {"t": "say", "text": "The term comes from Herbert Freudenberger, a psychologist who volunteered at free clinics in New York in the early 1970s. \"Burnout\" was already the word people there used for what long-term drug use did to a person. Freudenberger saw the staff, himself included, wearing down in a similar way, and in 1974 he borrowed the word for what the work was doing to the helpers."}, {"t": "say", "text": "Christina Maslach and her colleagues later identified 3 dimensions. Emotional exhaustion: feeling drained in a way that rest doesn't fix. Cynicism, also called depersonalization: a growing distance from the work, from coworkers, and from the people we serve. And reduced personal efficacy: doubting your ability to do work you used to feel confident in."}, {"t": "cue", "title": "How it shows up", "min": "1 min"}, {"t": "say", "text": "Station 1 will look closely at the difference between stress and burnout, so I'll keep this to the signs. Emotionally: exhaustion, irritability, dread about work, and emptiness where satisfaction used to be. Cognitively: trouble concentrating, memory lapses, and a cycle of self-doubt. Behaviorally: absences, procrastination, and pulling back from coworkers. Physically: fatigue, poor sleep, headaches, stomach issues, and getting sick more often."}, {"t": "say", "text": "These signs rarely appear alone, and some overlap with everyday stress. That overlap is what Station 1 will work through with you."}, {"t": "cue", "title": "What recovery looks like", "min": "1.5 min"}, {"t": "say", "text": "A 2026 study led by Tait Shanafelt followed physicians whose burnout improved substantially and asked them what changed. Nearly 9 in 10 had made an active change, either in their personal life or in how they worked. Very few improved by waiting it out. The most common personal change was separating their sense of self-worth from their role. Their work still mattered to them, but it stopped being their whole identity."}, {"t": "say", "text": "A 3-year study of more than 1,200 frontline health and social care workers found something related. People who felt their lives had meaning reported less burnout. People who were still searching for meaning reported more, and those searching hard while feeling little meaning had the highest cynicism. Work can be meaningful without having to carry all the meaning in your life. There's an optional take-home sheet on this idea by the exit."}, {"t": "cue", "title": "Ground rules and getting started", "min": "1 min"}, {"t": "say", "text": "Two ground rules. First, nothing you write today will be collected, except the dot stickers at Station 2. One station uses a validated burnout measure, and you keep that sheet. Second, no one will be asked to talk about their own situation. How much you share is up to you."}, {"t": "say", "text": "There are 4 stations, 8 minutes each. When you hear the call to rotate, move to the next station number, and Station 4 moves to Station 1. Each station stands on its own, so it doesn't matter where you start. Please count off from 1 to 4, and head to the station with your number."}, {"t": "stage", "text": "Point to each station as you name its number. The timekeeper starts the first rotation once every group has arrived."}], "closing": [{"t": "cue", "title": "The dot-vote results", "min": "5 min"}, {"t": "stage", "text": "Near the end of the last rotation, collect the dot-vote chart from Station 2 and bring it to the front. Keep the total out of view until everyone is back."}, {"t": "say", "text": "Welcome back. Please keep your MBI sheet and your commitment card with you."}, {"t": "say", "text": "This is the chart from Station 2. Every group added to it, and this is the first time anyone is seeing the full results. It reflects how this group sees the conditions we work in."}, {"t": "stage", "text": "Read the top 2 areas and their dot counts out loud. Pause briefly."}, {"t": "say", "text": "Does this match what you expected?"}, {"t": "say", "text": "For the area with the most dots, what does that look like day to day?"}, {"t": "stage", "text": "Take 2 or 3 responses, about 3 minutes total. Thank each person who speaks."}, {"t": "say", "text": "Here's what happens next. These 6 areas come from Maslach and Leiter's research on the organizational conditions that drive burnout. The committee will bring the top 2 to leadership life. Waiting it out rarely works."}, {"t": "say", "text": "6. A specific goal, reviewed on a schedule, works better than a general intention. That's the SMART goal and PDSA cycle from Station 4."}, {"t": "cue", "title": "Close", "min": "1 min"}, {"t": "say", "text": "Burnout is common in this work, and because it follows predictable patterns, it can be addressed. The conditions behind it can change, and today's results give the committee a place to start."}, {"t": "say", "text": "Thank you for being here and for taking part."}, {"t": "say", "text": "Before you go, write today's date on your MBI sheet and keep it somewhere you'll find it. In 3 months, score it again and compare the 2."}, {"t": "stage", "text": "Point out the take-home sheets on the way out. Committee members stay about 5 minutes after to photograph the chart."}]};
let filter = 'All', shuffled = false, order = [], pos = 0, known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem('sean-fc-known') || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem('sean-fc-known', JSON.stringify([...known])); } catch (e) {} };
const $ = id => document.getElementById(id);

function build() {
  order = DATA.cards.map((c, i) => i).filter(i => filter === 'All' || DATA.cards[i].part === filter);
  const left = order.filter(i => !known.has(i));
  order = left.length ? left : order;
  if (shuffled) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  pos = 0; show();
}
function show() {
  const card = $('card'); card.classList.remove('flip');
  const total = DATA.cards.filter(c => filter === 'All' || c.part === filter).length;
  const doneN = DATA.cards.filter((c, i) => (filter === 'All' || c.part === filter) && known.has(i)).length;
  $('count').textContent = doneN + ' of ' + total + ' down';
  $('prog').style.width = (total ? doneN / total * 100 : 0) + '%';
  if (pos >= order.length) {
    $('f-lab').textContent = 'Round done';
    $('f-q').innerHTML = 'All cards in this set are done. Tap “Again” to start the set over.';
    $('b-lab').textContent = ''; $('b-pts').innerHTML = ''; $('b-anc').textContent = '';
    return;
  }
  const i = order[pos], c = DATA.cards[i];
  $('f-lab').textContent = c.label + ' · #' + (i + 1);
  $('f-q').textContent = c.q;
  $('b-lab').textContent = c.label;
  $('b-pts').innerHTML = c.pts.map(p => '<li>' + esc(p) + '</li>').join('');
  $('b-anc').textContent = c.anchor;
}
const esc = s => s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function flip() { if (pos < order.length) $('card').classList.toggle('flip'); }
function got() { if (pos >= order.length) return; known.add(order[pos]); save(); pos++; show(); }
function again() {
  if (pos >= order.length) { DATA.cards.forEach((c, i) => { if (filter === 'All' || c.part === filter) known.delete(i); }); save(); build(); return; }
  const i = order.splice(pos, 1)[0]; order.push(i); show();
}
function prev() { if (pos > 0) { pos--; show(); } }

$('card').addEventListener('click', flip);
$('gotit').addEventListener('click', got);
$('again').addEventListener('click', again);
$('prev').addEventListener('click', prev);
document.querySelectorAll('.chip[data-f]').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f; document.querySelectorAll('.chip[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); build();
}));
$('shuffle').addEventListener('click', e => { shuffled = !shuffled; e.currentTarget.setAttribute('aria-pressed', shuffled); build(); });
document.addEventListener('keydown', e => {
  if (!$('script-view').hidden) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') got(); else if (e.key === 'ArrowLeft') prev(); else if (e.key.toLowerCase() === 'a') again();
});

function renderScript() {
  const part = (title, blocks) => '<h2>' + title + '</h2>' + blocks.map(b =>
    b.t === 'cue' ? '<div class="cue"><span>' + esc(b.title) + '</span><em>about ' + b.min + '</em></div>'
    : b.t === 'stage' ? '<div class="stage-dir">' + esc(b.text) + '</div>' : '<p class="say">' + esc(b.text) + '</p>').join('');
  $('script-view').innerHTML = part('Opening · about 10 minutes', DATA.opening) + part('Closing · about 10 minutes', DATA.closing);
}
function tab(which) {
  $('tab-cards').setAttribute('aria-selected', which === 'cards'); $('tab-script').setAttribute('aria-selected', which === 'script');
  $('cards-view').hidden = which !== 'cards'; $('script-view').hidden = which !== 'script';
}
$('tab-cards').addEventListener('click', () => tab('cards'));
$('tab-script').addEventListener('click', () => tab('script'));
renderScript(); build();
</script>
</body>
</html>
